<header class="header-home" [class.scrolled]="isScrolled">
  <div class="header-container layout-container">
    <a routerLink="/" class="logo-area" (click)="closeMenu()">
      <img src="assets/logo-perfil.png" alt="Emanuel Pinheiro">
      <div class="brand-info">
        <span class="brand">Emanuel Pinheiro</span>
        <span class="title">Desenvolvedor Front-End</span>
      </div>
    </a>

    <button class="menu-toggle" (click)="toggleMenu()" [class.active]="menuOpen" aria-label="Menu">
      <span></span>
      <span></span>
      <span></span>
    </button>

    @if (menuOpen) {
      <div class="menu-backdrop" (click)="closeMenu()"></div>
    }

    <nav class="menu" [class.active]="menuOpen">
      <a href="#home" (click)="scrollToSection('home', $event)" [class.active]="isActive('home')">Home</a>
      <a href="#sobre" (click)="scrollToSection('sobre', $event)" [class.active]="isActive('sobre')">Sobre</a>
      <a href="#projetos" (click)="scrollToSection('projetos', $event)" [class.active]="isActive('projetos')">Projetos</a>
      <a href="#contatos" (click)="scrollToSection('contatos', $event)" [class.active]="isActive('contatos')">Contatos</a>
    </nav>
  </div>
</header>
